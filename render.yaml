services:
  - type: web
    name: praiana
    runtime: node
    # ATENÇÃO: confirme se este é o nome exato do plano pago escolhido no
    # dashboard do Render (ex: starter). O plano "free" não suporta disco
    # persistente, então esse valor precisa bater com o plano ativo.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: praiana-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: lana
      - key: ADMIN_PASS_HASH
        sync: false
      - key: WHATSAPP_NUMERO
        value: "559296051474"
      - key: WHATSAPP_CATALOGO_URL
        value: https://wa.me/c/559296051474
      - key: INSTAGRAM_USUARIO
        value: praianabylana
      - key: SITE_URL
        value: https://www.praianabylana.com.br
